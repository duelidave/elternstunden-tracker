# Static SPA. The reverse proxy sends only non-API paths here and sets the security headers (12.3).
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Hashed build files never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routes fall back to index.html, which must never be cached
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

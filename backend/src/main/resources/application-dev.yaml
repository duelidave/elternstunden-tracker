# Local development. Reads ../.env (copied from .env.example) when started via ./gradlew :backend:bootRun;
# inside docker compose the same values arrive as environment variables.
spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:elternstunden}
    password: ${DB_PASSWORD:${DB_APP_PASSWORD}}
  flyway:
    user: ${FLYWAY_USER:${POSTGRES_USER:elternstunden}}
    password: ${FLYWAY_PASSWORD:${POSTGRES_PASSWORD}}

logging:
  level:
    de.elternstunden: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

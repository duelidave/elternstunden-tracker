# Production-safe defaults. Everything environment-specific comes from environment variables
# (prod: Docker secrets via configtree, M7). No secrets in this file.
spring:
  application:
    name: elternstunden
  datasource:
    # App role with DML rights only (OPS-14)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:elternstunden}
    username: ${DB_USER:elternstunden_app}
    password: ${DB_PASSWORD}
  flyway:
    # Owner role runs the migrations (OPS-14)
    user: ${FLYWAY_USER:elternstunden}
    password: ${FLYWAY_PASSWORD}
    placeholders:
      appRole: ${DB_USER:elternstunden_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    time-zone: UTC
    # Optional fields of the contract are left out instead of sent as null (OpenAPI 3.0, not nullable)
    default-property-inclusion: non_null
    deserialization:
      # Unknown fields are rejected (mass assignment protection, Lastenheft 8.1)
      fail-on-unknown-properties: true
  session:
    jdbc:
      # Flyway owns the session tables (V3)
      initialize-schema: never
  mail:
    # OPEN-07: SMTP service still open; local development uses Mailpit
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

server:
  port: 8080
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      # SEC-09: __Host- prefix, HttpOnly, Secure, SameSite=Lax, no Domain
      cookie:
        name: __Host-SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /

# Actuator only on the internal management port (OPS-07)
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Mail outages are monitored via metrics (OPS-13), they must not mark the app as down
    mail:
      enabled: false

app:
  # The only source for links in mails (SEC-17), never taken from request headers
  base-url: ${APP_BASE_URL}
  mail:
    from: ${MAIL_FROM:Elternstunden <no-reply@localhost>}
  security:
    encryption-key: ${APP_ENCRYPTION_KEY}
    # OPEN-09: TOTP for admins optional until decided
    admin-totp-required: false
  auth:
    token-ttl: 15m
    pending-account-ttl: 24h
    binding-cookie-max-age: 30d
    mail-max-attempts: 3
    mail-retry-delay: 1m
    worker-batch-size: 20
    worker-delay: 2s
    cleanup-cron: "0 30 3 * * *"
    captcha:
      hmac-key: ${ALTCHA_HMAC_KEY}
      cost: 5000
      expires: 5m
  # Lastenheft 9.1, all configurable
  rate-limits:
    register-per-ip-hour: { max: 30, window: 1h }
    register-per-ip-day: { max: 100, window: 24h }
    register-global: { max: 200, window: 1h }
    magic-link-per-ip: { max: 20, window: 1h }
    magic-link-global: { max: 200, window: 1h }
    mail-per-target: { max: 5, window: 1h }
    no-account-mail-per-target: { max: 1, window: 24h }
    redeem-per-ip: { max: 30, window: 15m }
    master-login-per-ip: { max: 5, window: 15m }
    master-failure-alarm: { max: 10, window: 1h }
    oidc-callback-per-ip: { max: 30, window: 1m }
    passkey-per-ip: { max: 30, window: 1m }
    mfa-per-ip: { max: 5, window: 15m }
    entry-per-user: { max: 60, window: 1h }
  # D-20
  sessions:
    family-member: { idle: 30d, absolute: 90d }
    admin: { idle: 30m, absolute: 8h }
    master-admin: { idle: 15m, absolute: 4h }
  # 7.1.4, 7.1.7, 9.1, DP-05
  claims:
    max-per-target: 5
    window: 24h
    max-corrections: 3
    retention: 30d
  # 5.5: next school year 90 days ahead, daily job
  school-years:
    lead-time: 90d
    job-cron: "0 15 3 * * *"
  # 7.2, D-23, D-30. A provider without client id is off; the login page shows the buttons in this order
  oidc:
    pending-ttl: 15m
    reauth-window: 5m
    providers:
      google:
        name: Google
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        issuer: https://accounts.google.com
        trust-email-for-linking: GMAIL_OR_HD
      # Login with the GMX or WEB.DE account; users may deselect data, so the e-mail is an essential claim
      netid:
        name: netID
        client-id: ${NETID_CLIENT_ID:}
        client-secret: ${NETID_CLIENT_SECRET:}
        issuer: https://broker.netid.de/
        trust-email-for-linking: DOMAINS
        trusted-email-domains: [gmx.de, gmx.net, gmx.at, gmx.ch, web.de]
        essential-email: true
  # SEC-05
  mfa:
    pending-ttl: 10m
    recovery-codes: 10
  # D-22, 7.9: from the configuration only
  master:
    email: ${MASTER_ADMIN_EMAIL:}
    password-hash: ${MASTER_ADMIN_PASSWORD_HASH:}
    totp-secret: ${MASTER_ADMIN_TOTP_SECRET:}
    display-name: ${MASTER_ADMIN_DISPLAY_NAME:Master-Admin}

---
# JSON logs with traceId everywhere except local development (NFR-06)
spring:
  config:
    activate:
      on-profile: "!dev"
logging:
  structured:
    format:
      console: ecs

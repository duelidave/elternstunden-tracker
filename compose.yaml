# Local development stack (OPS-01). Start: cp .env.example .env && docker compose up --build
# All ports are bound to 127.0.0.1 only. Production compose follows in M7 (ops/).
name: elternstunden-dev

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Used once by the init script to create the app role (OPS-14)
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
      TZ: Europe/Berlin
    volumes:
      # postgres:18 keeps PGDATA below /var/lib/postgresql/18/docker
      - pgdata:/var/lib/postgresql
      - ./ops/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # OPEN-07: mail catcher for development; the production SMTP service is still open
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  # OPEN-15: local OIDC provider instead of Google (navikt/mock-oauth2-server)
  # Stands in for Google locally (OPEN-15). Sign in with any address as user name, e.g. anna@gmail.com.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.6
    environment:
      JSON_CONFIG: >-
        {"interactiveLogin": true,
         "tokenCallbacks": [{"issuerId": "default", "tokenExpiry": 300,
           "requestMappings": [{"requestParam": "grant_type", "match": "authorization_code",
             "claims": {"sub": "$${subject}", "email": "$${subject}", "email_verified": true,
                        "name": "$${subject}"}}]}]}

  # The mock derives the issuer from the Host header. The gateway always passes localhost:8090, so the browser and
  # the app container see the same issuer and the app can check it (AC-OIDC-06).
  oidc-gateway:
    image: nginx:1.29.8-alpine
    configs:
      - source: oidc-gateway
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "127.0.0.1:${OIDC_PORT:-8090}:8090"
    depends_on:
      - oidc

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Europe/Berlin
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: elternstunden_app
      DB_PASSWORD: ${DB_APP_PASSWORD}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:?set ALTCHA_HMAC_KEY in .env}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      SMTP_HOST: mailpit # OPEN-07
      SMTP_PORT: "1025"
      MASTER_ADMIN_EMAIL: ${MASTER_ADMIN_EMAIL:?set MASTER_ADMIN_EMAIL in .env}
      MASTER_ADMIN_PASSWORD_HASH: ${MASTER_ADMIN_PASSWORD_HASH:?set MASTER_ADMIN_PASSWORD_HASH in .env}
      MASTER_ADMIN_TOTP_SECRET: ${MASTER_ADMIN_TOTP_SECRET:?set MASTER_ADMIN_TOTP_SECRET in .env}
      # Server-to-server calls to the OIDC mock (token, keys) go through the gateway
      OIDC_SERVER_URL: http://oidc-gateway:8090
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
      - "127.0.0.1:${APP_MANAGEMENT_PORT:-8089}:8081"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      oidc-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

configs:
  oidc-gateway:
    content: |
      server {
        listen 8090;
        location / {
          proxy_pass http://oidc:8080;
          proxy_set_header Host localhost:8090;
        }
      }

volumes:
  pgdata:

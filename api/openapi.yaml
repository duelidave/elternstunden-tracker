openapi: 3.0.3
info:
  title: Elternstunden API
  version: 0.6.1
  description: |
    API-Vertrag der Elternstunden-Zeiterfassung und Quelle der Wahrheit für Backend und Frontend
    (Lastenheft D-25). Jede API-Änderung beginnt hier, danach wird auf beiden Seiten neu generiert.

    Konventionen: Lastenheft Abschnitt 8.1. Fehler sind immer `application/problem+json` (RFC 9457).
    `x-roles` nennt die erlaubten Rollen mit den Kürzeln aus Abschnitt 8.2:
    A (anonym), U (angemeldet), F (Familienmitglied mit Familie), AD (Admin oder Master),
    M (Master), OP (OIDC-Pending-Session), MP (MFA-Pending-Session).
servers:
  - url: /api/v1
tags:
  - name: system
    description: Betrieb und Erreichbarkeit.
  - name: auth
    description: Registrierung, E-Mail-Link, Master-Login und Abmelden (FS-REG 7.1.4, FS-AUTH 7.2).
  - name: me
    description: Das eigene Konto.
  - name: my-family
    description: Familienübersicht und Einträge der eigenen Familie (FS-FAM 7.3, FS-ENTRY 7.4).
  - name: entries
    description: Bestätigen und Korrigieren von Einträgen durch Admins (FS-CONF 7.5, INV-07).
  - name: dashboard
    description: Admin-Startseite mit Widgets (FS-ADMOV 7.6).
  - name: overview
    description: Admin-Übersicht der Familien mit Stunden und Hinweisleiste (FS-ADMOV 7.6, D-11).
  - name: reports
    description: Abrechnung als PDF (FS-PDF 7.8, D-12).
  - name: school-years
    description: Schuljahre mit Stichtagen und Soll (5.5, FS-ADM 7.7).
  - name: families
    description: Familien (FS-ADM 7.7).
  - name: children
    description: Kinder, Einschreibungen und CSV-Import (FS-ADM 7.7).
  - name: users
    description: Nutzerverwaltung und Zuordnung zur Familie (FS-ADM 7.7, F5).
  - name: dev
    description: Nur in der lokalen Entwicklung (Profil dev, FS-DEV 7.12). Fehlt in Produktion.
security:
  - session: []
paths:
  /status:
    get:
      tags: [system]
      operationId: getStatus
      summary: Öffentliche Prüfseite
      description: Einfache Statusabfrage ohne Details, z. B. für einen externen Uptime-Check (OPS-07).
      x-roles: [A]
      security: []
      responses:
        '200':
          description: Der Dienst ist erreichbar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                status: UP
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/captcha:
    get:
      tags: [auth]
      operationId: getCaptchaChallenge
      summary: Captcha-Aufgabe holen
      description: Signierte ALTCHA-Aufgabe (Proof of Work) für Registrierung und Link-Anfrage (SEC-04, 9.1).
      x-roles: [A]
      security: []
      responses:
        '200':
          description: Neue Aufgabe, 5 Minuten gültig.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaChallenge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register:
    post:
      tags: [auth]
      operationId: registerAccount
      summary: Registrieren (Weg A)
      description: >-
        Antwortet für jede gültige Anfrage identisch mit 202, egal ob es die Adresse schon gibt (kein Orakel,
        7.1.4). Die eigentliche Verarbeitung und der Mailversand laufen asynchron.
      x-roles: [A]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '202':
          description: Angenommen. Wenn alles passt, kommt eine E-Mail mit Link.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/magic-link:
    post:
      tags: [auth]
      operationId: requestMagicLink
      summary: E-Mail-Link anfordern
      description: Antwortet für jede gültige Anfrage identisch mit 202 (kein Orakel, 7.2).
      x-roles: [A]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          description: Angenommen. Wenn es ein Konto gibt, kommt eine E-Mail mit Link.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/magic-link/redeem:
    post:
      tags: [auth]
      operationId: redeemMagicLink
      summary: E-Mail-Link einlösen
      description: >-
        Meldet an und legt eine neue Session an (7.2). Ein GET löst nie ein. Wurde der Link auf einem anderen
        Gerät angefordert, kommt zuerst 409 mit der maskierten Adresse, der Token bleibt gültig.
      x-roles: [A]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRedemption'
      responses:
        '200':
          description: Angemeldet oder, bei Admins mit zweitem Faktor, erst halb angemeldet (MFA_PENDING).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Link von einem anderen Gerät, Bestätigung nötig (OTHER_DEVICE_CONFIRMATION_REQUIRED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OtherDeviceProblem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/master/login:
    post:
      tags: [auth]
      operationId: loginMaster
      summary: Master-Login
      description: Nur für den per Konfiguration verwalteten Master-Admin, mit Passwort und TOTP (D-22, 7.2).
      x-roles: [A]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterLoginRequest'
      responses:
        '200':
          description: Angemeldet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Abmelden
      description: Beendet die Session serverseitig, auch eine halbe Anmeldung (OIDC_PENDING, MFA_PENDING).
      x-roles: [U, OP, MP]
      responses:
        '204':
          description: Abgemeldet.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/oidc/pending:
    get:
      tags: [auth]
      operationId: getOidcPending
      summary: Daten für "Noch ein Schritt"
      description: >-
        Nur in einer Session im Zustand OIDC_PENDING, also nach dem Anbieter-Login ohne bestehendes Konto (7.1.5 Schritt 4). Der Zustand verfällt nach 15 Minuten.
      x-roles: [OP]
      responses:
        '200':
          description: Angaben vom Anbieter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcPending'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/oidc/complete:
    post:
      tags: [auth]
      operationId: completeOidcRegistration
      summary: Registrierung per Anbieter abschließen
      description: >-
        Legt Konto (ACTIVE), Identität und Claim an und meldet an; bei Treffer ist die Familie sofort zugeordnet (7.1.5). Idempotent: gibt es die Identität schon, wird nur angemeldet.
      x-roles: [OP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcCompletion'
      responses:
        '200':
          description: Angemeldet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/mfa/verify:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Zweiten Faktor prüfen
      description: >-
        Nur im Zustand MFA_PENDING (7.2). TOTP-Code oder Wiederherstellungscode. Erfolg: volle Session mit neuer Session-ID. Fehler: 400 MFA_INVALID.
      x-roles: [MP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerification'
      responses:
        '200':
          description: Angemeldet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Eigenes Konto
      x-roles: [U]
      responses:
        '200':
          description: Das angemeldete Konto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [me]
      operationId: updateMe
      summary: Anzeigenamen ändern
      x-roles: [U]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          description: Das geänderte Konto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/claim:
    put:
      tags: [me]
      operationId: updateMyClaim
      summary: Kinderdaten eingeben oder korrigieren
      description: >-
        Nur für Familienmitglieder ohne Familie (7.1.7). Ohne gültigen Claim ist es die erste Eingabe, sonst eine Korrektur (höchstens 3 pro Konto, danach 409 CLAIM_CORRECTION_LIMIT). Zugeordnete Nutzer erhalten 409 ALREADY_ASSIGNED. Passt die Eingabe genau auf ein Kind, wird sofort zugeordnet.
      x-roles: [U]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildClaim'
      responses:
        '200':
          description: Das Konto nach der Eingabe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/identities/{provider}/link:
    post:
      tags: [me]
      operationId: startIdentityLink
      summary: Anbieter verknüpfen
      description: >-
        Liefert die Einstiegs-URL; die SPA navigiert per Top-Level-GET dorthin (SEC-10). Nur mit frischer Anmeldung (höchstens 5 Minuten alt), sonst 403 REAUTH_REQUIRED. Unbekannter Anbieter: 404.
      x-roles: [U]
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '200':
          description: Einstieg zum Anbieter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityLinkStart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/identities/{identityId}:
    delete:
      tags: [me]
      operationId: deleteIdentity
      summary: Verknüpfung entfernen
      description: >-
        Nur eigene Identitäten (sonst 404, SEC-08). Immer erlaubt, der E-Mail-Link bleibt als Anmeldeweg (INV-11).
      x-roles: [U]
      parameters:
        - $ref: '#/components/parameters/IdentityId'
      responses:
        '204':
          description: Entfernt.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/totp/setup:
    post:
      tags: [me]
      operationId: setupTotp
      summary: TOTP einrichten
      description: >-
        Erzeugt ein neues Secret (Base32) für die Authenticator-App; aktiv wird es erst mit /me/totp/confirm. Nur für Admins, auch im Zustand MFA_PENDING, wenn TOTP Pflicht ist und noch fehlt (7.2).
      x-roles: [AD, MP]
      responses:
        '200':
          description: Secret und otpauth-URI für den QR-Code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/totp/confirm:
    post:
      tags: [me]
      operationId: confirmTotp
      summary: TOTP bestätigen
      description: >-
        Aktiviert das Secret mit einem gültigen Code und liefert einmalig 10 Wiederherstellungscodes (SEC-05). Im Zustand MFA_PENDING folgt die volle Anmeldung. Falscher Code: 400 MFA_INVALID, ohne vorheriges Setup: 409 TOTP_SETUP_MISSING.
      x-roles: [AD, MP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerification'
      responses:
        '200':
          description: Aktiviert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpConfirmation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/totp:
    delete:
      tags: [me]
      operationId: disableTotp
      summary: TOTP deaktivieren
      description: >-
        Nur mit frischer Anmeldung (5 Minuten, sonst 403 REAUTH_REQUIRED) und nur, wenn TOTP nicht Pflicht ist (sonst 409 TOTP_REQUIRED).
      x-roles: [AD]
      responses:
        '204':
          description: Deaktiviert.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/family/overview:
    get:
      tags: [my-family]
      operationId: getFamilyOverview
      summary: Familienübersicht
      description: >-
        Startseite der Familie (FS-FAM 7.3): Fortschritt im Schuljahr, Kinder (nur Vornamen), Mitglieder (nur Anzeigenamen), Partnerhinweis und Einträge. Ohne schoolYearId das aktuelle Schuljahr (5.5). Ohne Familie: 403 FAMILY_ASSIGNMENT_PENDING. Ohne Schuljahr: 404 NO_CURRENT_SCHOOL_YEAR.
      x-roles: [F]
      parameters:
        - $ref: '#/components/parameters/SchoolYearFilter'
      responses:
        '200':
          description: Die Übersicht.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/family/entries:
    get:
      tags: [my-family]
      operationId: listFamilyEntries
      summary: Einträge der Familie
      description: >-
        Neueste zuerst (7.3 Regel 3), ohne gelöschte. Ohne schoolYearId das aktuelle Schuljahr.
      x-roles: [F]
      parameters:
        - $ref: '#/components/parameters/SchoolYearFilter'
      responses:
        '200':
          description: Die Einträge.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [my-family]
      operationId: createFamilyEntry
      summary: Stunden eintragen
      description: >-
        Neuer Eintrag mit Status OPEN (FS-ENTRY 7.4), nur im laufenden Schuljahr (D-29). Fehler: Zukunft 400 DATE_IN_FUTURE, kein Schuljahr 400 NO_SCHOOL_YEAR, abgeschlossenes Schuljahr 409 SCHOOL_YEAR_CLOSED, anderes Schuljahr als das laufende 400 DATE_OUTSIDE_CURRENT_SCHOOL_YEAR, gleicher Eintrag innerhalb von 2 Minuten 409 DUPLICATE_ENTRY.
      x-roles: [F]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreate'
      responses:
        '201':
          description: Eingetragen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/family/entries/{entryId}:
    patch:
      tags: [my-family]
      operationId: updateFamilyEntry
      summary: Eigenen Eintrag ändern
      description: >-
        Nur offene Einträge der eigenen Familie im laufenden Schuljahr (INV-05, INV-06, INV-14). Nur angegebene Felder ändern sich; ein leerer Text bei startTime entfernt die Uhrzeit. Veraltete version: 409 CONCURRENT_MODIFICATION, bestätigt: 409 ENTRY_CONFIRMED, Eintrag aus einem anderen Schuljahr: 409 SCHOOL_YEAR_NOT_CURRENT, neues Datum außerhalb des laufenden Schuljahres: 400 DATE_OUTSIDE_CURRENT_SCHOOL_YEAR, fremde Familie: 404 (SEC-08).
      x-roles: [F]
      parameters:
        - $ref: '#/components/parameters/EntryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryUpdate'
      responses:
        '200':
          description: Geändert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [my-family]
      operationId: deleteFamilyEntry
      summary: Eigenen Eintrag löschen
      description: >-
        Soft-Delete, nur offene Einträge der eigenen Familie im laufenden Schuljahr (INV-14). Bestätigt: 409 ENTRY_CONFIRMED, Eintrag aus einem anderen Schuljahr: 409 SCHOOL_YEAR_NOT_CURRENT, fremde Familie: 404.
      x-roles: [F]
      parameters:
        - $ref: '#/components/parameters/EntryId'
      responses:
        '204':
          description: Gelöscht.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/entries:
    get:
      tags: [entries]
      operationId: listEntries
      summary: Einträge für Admins
      description: >-
        Zum Bestätigen (status=OPEN) und Korrigieren, älteste Erfassung zuerst (7.5). Filter Familie und Zeitraum (Datum der Arbeit).
      x-roles: [AD]
      parameters:
        - $ref: '#/components/parameters/EntryStatusFilter'
        - $ref: '#/components/parameters/FamilyFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Eine Seite Einträge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/entries/confirm:
    post:
      tags: [entries]
      operationId: confirmEntries
      summary: Mehrere Einträge bestätigen
      description: >-
        Sammelbestätigung (7.5 Punkt 4). Bereits bestätigte und Einträge abgeschlossener Schuljahre bleiben unverändert und zählen als übersprungen.
      x-roles: [AD]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryConfirmation'
      responses:
        '200':
          description: Ergebnis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [users]
      operationId: removeUserFromFamily
      summary: Zuordnung entfernen
      description: >-
        Idempotent. Master: 409 ACCOUNT_MANAGED_BY_CONFIG.
      x-roles: [AD]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Nicht mehr zugeordnet.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users/{userId}/role:
    put:
      tags: [users]
      operationId: setUserRole
      summary: Rolle setzen
      description: >-
        Familienmitglied oder Admin (D-13). Master: 409 ACCOUNT_MANAGED_BY_CONFIG, eigenes Konto: 409 OWN_ACCOUNT.
      x-roles: [AD]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChange'
      responses:
        '200':
          description: Geändert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users/{userId}/disable:
    post:
      tags: [users]
      operationId: disableUser
      summary: Nutzer deaktivieren
      description: >-
        Beendet alle Sessions des Nutzers (7.2). Idempotent. Master: 409 ACCOUNT_MANAGED_BY_CONFIG, eigenes Konto: 409 OWN_ACCOUNT.
      x-roles: [AD]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Deaktiviert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users/{userId}/enable:
    post:
      tags: [users]
      operationId: enableUser
      summary: Nutzer wieder aktivieren
      description: >-
        Idempotent. Ein Konto mit nie bestätigter Adresse wird wieder unbestätigt. Anonymisierte Konten bleiben deaktiviert (409 USER_ANONYMIZED).
      x-roles: [AD]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Aktiviert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users/{userId}/totp:
    delete:
      tags: [users]
      operationId: resetUserTotp
      summary: TOTP eines Admins zurücksetzen
      description: >-
        Für ein verlorenes Gerät (7.2). Eigenes Konto: 409 OWN_ACCOUNT (dafür DELETE /me/totp). Master: 409 ACCOUNT_MANAGED_BY_CONFIG.
      x-roles: [AD]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Zurückgesetzt.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users/{userId}/terminate-sessions:
    post:
      tags: [users]
      operationId: terminateUserSessions
      summary: Alle Sessions beenden
      x-roles: [AD]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Alle Sessions des Nutzers sind beendet.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users/{userId}/anonymize:
    post:
      tags: [users]
      operationId: anonymizeUser
      summary: Nutzer anonymisieren
      description: >-
        DP-05 (a): E-Mail `deleted-{id}@invalid`, Name "Gelöschter Nutzer", Tokens, Claims und Sessions gelöscht, deaktiviert, aus der Familie gelöst. Einträge bleiben. Nicht umkehrbar. Master: 409 ACCOUNT_MANAGED_BY_CONFIG, eigenes Konto: 409 OWN_ACCOUNT.
      x-roles: [AD]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Anonymisiert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /dev/login-as:
    post:
      tags: [dev]
      operationId: devLoginAs
      summary: Als Demo-Konto anmelden (nur lokal)
      description: >-
        Rollenwechsel für manuelle Tests (D-26, FS-DEV 7.12). Gibt es nur im Profil dev, sonst 404.
        Meldet über denselben Weg an wie der E-Mail-Link, ohne Mail und ohne TOTP.
      x-roles: [A]
      x-dev-only: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
      responses:
        '200':
          description: Angemeldet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-SESSION
      description: >-
        Serverseitige Session (D-20). Zustandsändernde Requests tragen zusätzlich den CSRF-Token
        im Header `X-XSRF-TOKEN` (Cookie `XSRF-TOKEN`).
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
    CaptchaChallenge:
      type: object
      description: ALTCHA-Aufgabe im Format des Widgets (Protokoll v2, PBKDF2/SHA-256).
      required: [parameters, signature]
      properties:
        parameters:
          type: object
          additionalProperties: true
        signature:
          type: string
    RegistrationRequest:
      type: object
      required: [displayName, email, child, privacyAccepted]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          example: Anna Beispiel
        email:
          type: string
          format: email
          maxLength: 254
        child:
          $ref: '#/components/schemas/ChildClaim'
        privacyAccepted:
          type: boolean
          description: Muss true sein (DP-03).
        captcha:
          $ref: '#/components/schemas/CaptchaSolution'
    ChildClaim:
      type: object
      description: Angaben zum Kind für die Zuordnung zur Familie (7.1.2).
      required: [firstName, lastName, birthDate]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        birthDate:
          type: string
          format: date
          description: Nicht in der Zukunft, höchstens 25 Jahre zurück.
    CaptchaSolution:
      type: string
      description: >-
        Base64-Nachweis des ALTCHA-Widgets. Fachlich Pflicht: Fehlt er oder ist er ungültig, abgelaufen oder
        schon benutzt, antwortet der Server mit 400 CAPTCHA_INVALID (AC-REG-06).
      minLength: 1
      maxLength: 4000
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        captcha:
          $ref: '#/components/schemas/CaptchaSolution'
    MagicLinkRedemption:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Token aus dem URL-Fragment des Links (256 Bit, base64url).
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
        confirmOtherDevice:
          type: boolean
          default: false
          description: Bestätigt die Anmeldung auf einem anderen Gerät als dem, das den Link angefordert hat.
    MasterLoginRequest:
      type: object
      required: [email, password, totp]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
        totp:
          type: string
          pattern: '^[0-9]{6}$'
    DevLoginRequest:
      type: object
      required: [account]
      properties:
        account:
          type: string
          enum: [FAMILY, PARTNER, UNASSIGNED, ADMIN, MASTER]
    Me:
      type: object
      required: [id, displayName, email, role, assignedToFamily]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [FAMILY_MEMBER, ADMIN, MASTER_ADMIN]
        assignedToFamily:
          type: boolean
        pendingClaim:
          $ref: '#/components/schemas/ChildClaim'
        identities:
          type: array
          description: Verknüpfte Anbieter-Konten (7.2 "Profil").
          items:
            $ref: '#/components/schemas/Identity'
        totpEnabled:
          type: boolean
          description: Nur für Admins.
        totpRequired:
          type: boolean
          description: Nur für Admins (app.security.admin-totp-required, OPEN-09).
        claimCorrectionsLeft:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Nur für Familienmitglieder ohne Familie: verbleibende Korrekturen der Kinderdaten (7.1.7). Fehlt
            `pendingClaim`, ist die nächste Eingabe die erste und zählt nicht als Korrektur.
    PageInfo:
      type: object
      description: Paging-Angaben jeder Liste (8.1).
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    SchoolYear:
      type: object
      required: [id, label, startsOn, endsOn, requiredMinutes, closed, current]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          example: 2026/27
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        requiredMinutes:
          type: integer
          format: int32
          example: 600
        closed:
          type: boolean
        current:
          type: boolean
          description: Das aktuelle Schuljahr nach 5.5 (heute, sonst das zuletzt beendete).
    SchoolYearCreate:
      type: object
      required: [label, startsOn, endsOn]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 20
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
          description: Muss nach `startsOn` liegen.
        requiredMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 60000
          default: 600
    SchoolYearUpdate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 20
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        requiredMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 60000
    EnrollmentCopyResult:
      type: object
      required: [copied]
      properties:
        copied:
          type: integer
          format: int32
    ChildName:
      type: object
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
    FamilySummary:
      type: object
      required: [id, displayLabel, children, memberCount]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        displayLabel:
          type: string
          description: Die Bezeichnung oder, falls leer, die Nachnamen der Kinder.
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChildName'
        memberCount:
          type: integer
          format: int32
          description: Aktive Mitglieder.
    FamilyPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/FamilySummary'
    FamilyMember:
      type: object
      required: [id, displayName, email, status]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
    FamilyDetail:
      type: object
      required: [id, displayLabel, children, members]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        note:
          type: string
        displayLabel:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/AdminChild'
        members:
          type: array
          items:
            $ref: '#/components/schemas/FamilyMember'
    FamilyUpdate:
      type: object
      properties:
        label:
          type: string
          maxLength: 80
        note:
          type: string
          maxLength: 1000
    AdminChild:
      type: object
      required: [id, firstName, lastName, birthDate, familyId, familyLabel, enrolledSchoolYearIds]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        externalRef:
          type: string
        familyId:
          type: string
          format: uuid
        familyLabel:
          type: string
        enrolledSchoolYearIds:
          type: array
          items:
            type: string
            format: uuid
    ChildPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AdminChild'
    ChildCreate:
      type: object
      required: [firstName, lastName, birthDate]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        birthDate:
          type: string
          format: date
          description: Nicht in der Zukunft.
        externalRef:
          type: string
          maxLength: 100
          description: Eindeutig, sonst 409 EXTERNAL_REF_TAKEN (D-04).
        familyId:
          type: string
          format: uuid
        newFamilyLabel:
          type: string
          maxLength: 80
    ChildUpdate:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        birthDate:
          type: string
          format: date
        externalRef:
          type: string
          maxLength: 100
        familyId:
          type: string
          format: uuid
    ImportResult:
      type: object
      required: [dryRun, applied, created, updated, unchanged, errors]
      properties:
        dryRun:
          type: boolean
        applied:
          type: boolean
          description: true, wenn der Import geschrieben wurde (kein Dry-Run und keine fehlerhaften Zeilen).
        created:
          type: integer
          format: int32
        updated:
          type: integer
          format: int32
        unchanged:
          type: integer
          format: int32
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportError'
    ImportError:
      type: object
      required: [line, code]
      properties:
        line:
          type: integer
          format: int32
          description: Zeilennummer in der Datei, die Kopfzeile ist Zeile 1.
        code:
          type: string
          enum: [INVALID_HEADER, INVALID_COLUMNS, MISSING_VALUE, VALUE_TOO_LONG, INVALID_DATE, DUPLICATE_CHILD, EXTERNAL_REF_CONFLICT, FAMILY_KEY_CONFLICT]
    UserStatus:
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, DISABLED]
    AdminUser:
      type: object
      required: [id, displayName, email, role, status, managedByConfig, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [FAMILY_MEMBER, ADMIN, MASTER_ADMIN]
        status:
          $ref: '#/components/schemas/UserStatus'
        familyId:
          type: string
          format: uuid
        familyLabel:
          type: string
        managedByConfig:
          type: boolean
          description: Der Master-Admin, nur per Konfiguration änderbar (D-22).
        totpEnabled:
          type: boolean
          description: Admin mit eingerichtetem zweitem Faktor.
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AdminUser'
    AdminClaim:
      type: object
      description: Die bei der Registrierung oder auf dem Wartescreen angegebenen Kinderdaten (7.1.7).
      required: [id, firstName, lastName, birthDate, matchResult, createdAt]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        matchResult:
          type: string
          enum: [MATCHED, NO_MATCH, AMBIGUOUS, THROTTLED]
        createdAt:
          type: string
          format: date-time
    ChildCandidate:
      type: object
      description: Kind mit gleichem Geburtsdatum oder ähnlichem Nachnamen (7.1.7).
      required: [childId, firstName, lastName, birthDate, familyId, familyLabel]
      properties:
        childId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        familyId:
          type: string
          format: uuid
        familyLabel:
          type: string
    AdminUserDetail:
      type: object
      required: [user, candidates]
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
        claim:
          $ref: '#/components/schemas/AdminClaim'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ChildCandidate'
    FamilyAssignment:
      type: object
      required: [familyId]
      properties:
        familyId:
          type: string
          format: uuid
    RoleChange:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [FAMILY_MEMBER, ADMIN]
    AutoAssignment:
      type: object
      required: [userId, displayName, familyId, familyLabel, assignedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        familyId:
          type: string
          format: uuid
        familyLabel:
          type: string
        assignedAt:
          type: string
          format: date-time
    ReportScope:
      type: string
      description: ALL = Gesamtübersicht, FAMILY = Einzelabrechnung einer Familie.
      enum: [ALL, FAMILY]
    ReportKind:
      type: string
      description: INTERIM = Zwischenstand, FINAL = Abschluss des Schuljahres.
      enum: [INTERIM, FINAL]
    OverviewPage:
      type: object
      required: [schoolYear, requiredMinutes, familyCount, missingCount, content, page, size, totalElements,
                 totalPages]
      properties:
        schoolYear:
          $ref: '#/components/schemas/SchoolYearRef'
        requiredMinutes:
          type: integer
          format: int32
          description: Soll je Familie im Schuljahr (D-02).
        familyCount:
          type: integer
          format: int32
          description: Soll-pflichtige Familien im Schuljahr ("m" der Hinweisleiste), ohne Suche und Filter.
        missingCount:
          type: integer
          format: int32
          description: Davon Familien mit fehlenden Minuten ("n" der Hinweisleiste), ohne Suche und Filter.
        content:
          type: array
          items:
            $ref: '#/components/schemas/OverviewRow'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    OverviewRow:
      type: object
      required: [familyId, familyLabel, children, memberCount, confirmedMinutes, openMinutes, missingMinutes]
      properties:
        familyId:
          type: string
          format: uuid
        familyLabel:
          type: string
          description: Bezeichnung oder aus den Nachnamen der Kinder abgeleitet.
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChildName'
        memberCount:
          type: integer
          format: int32
          description: Aktive Mitglieder.
        confirmedMinutes:
          type: integer
          format: int32
        openMinutes:
          type: integer
          format: int32
        missingMinutes:
          type: integer
          format: int32
          description: max(Soll - bestätigt, 0).
    AdminDashboard:
      type: object
      required: [unassignedUsers, recentAutoAssignments, openEntryCount]
      properties:
        openEntryCount:
          type: integer
          format: int32
          description: Offene Einträge zum Bestätigen (7.5 Punkt 6, Widget "Zu bestätigen").
        unassignedUsers:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserDetail'
        recentAutoAssignments:
          type: array
          items:
            $ref: '#/components/schemas/AutoAssignment'
    LoginResult:
      type: object
      description: Ergebnis einer Anmeldung (7.2). Bei MFA_REQUIRED oder MFA_SETUP_REQUIRED fehlt noch der zweite Faktor.
      required: [status]
      properties:
        status:
          type: string
          enum: [LOGGED_IN, MFA_REQUIRED, MFA_SETUP_REQUIRED]
    OidcPending:
      type: object
      required: [provider, email, displayName]
      properties:
        provider:
          type: string
          example: google
        email:
          type: string
        displayName:
          type: string
          description: Aus dem name-Claim vorbelegt, editierbar (7.1.2).
    OidcCompletion:
      type: object
      required: [displayName, child]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        child:
          $ref: '#/components/schemas/ChildClaim'
    MfaVerification:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-stelliger TOTP-Code oder ein Wiederherstellungscode.
          minLength: 6
          maxLength: 20
    MeUpdate:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
    Identity:
      type: object
      required: [id, provider, createdAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          example: google
        emailAtLink:
          type: string
          description: E-Mail beim Anbieter zum Zeitpunkt der Verknüpfung, nur zur Anzeige.
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    IdentityLinkStart:
      type: object
      required: [redirectUrl]
      properties:
        redirectUrl:
          type: string
          description: Relative URL des Einstiegs, z. B. /oauth2/authorization/google.
    TotpSetup:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32, zum Abtippen.
        otpauthUri:
          type: string
          description: Inhalt des QR-Codes für die Authenticator-App.
    TotpConfirmation:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          description: 10 Wiederherstellungscodes, nur dieses eine Mal sichtbar (SEC-05).
          items:
            type: string
    SchoolYearRef:
      type: object
      required: [id, label, startsOn, endsOn, closed]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        closed:
          type: boolean
    FamilyOverview:
      type: object
      description: Datenvertrag aus FS-FAM 7.3. Nur bestätigte Minuten zählen (D-10).
      required: [schoolYear, schoolYears, obligated, requiredMinutes, confirmedMinutes, openMinutes, remainingMinutes,
                 fulfilled, canAddEntries, children, members, partnerHint, entries]
      properties:
        schoolYear:
          $ref: '#/components/schemas/SchoolYearRef'
        schoolYears:
          type: array
          description: Schuljahre, die schon begonnen haben; frühere sind schreibgeschützt.
          items:
            $ref: '#/components/schemas/SchoolYearRef'
        obligated:
          type: boolean
          description: Mindestens ein Kind der Familie ist in diesem Schuljahr eingeschrieben (OPEN-04).
        requiredMinutes:
          type: integer
          format: int32
        confirmedMinutes:
          type: integer
          format: int32
        openMinutes:
          type: integer
          format: int32
        remainingMinutes:
          type: integer
          format: int32
        fulfilled:
          type: boolean
        canAddEntries:
          type: boolean
          description: Nur im laufenden, offenen Schuljahr (5.5 Regel 4, INV-04).
        children:
          type: array
          items:
            $ref: '#/components/schemas/FamilyChild'
        members:
          type: array
          items:
            $ref: '#/components/schemas/FamilyMemberName'
        partnerHint:
          type: boolean
          description: Genau ein aktives Mitglied (7.3 Regel 6).
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FamilyEntry'
    FamilyChild:
      type: object
      description: Nur der Vorname (7.3 Regel 7, DP-02).
      required: [firstName]
      properties:
        firstName:
          type: string
    FamilyMemberName:
      type: object
      description: Nur der Anzeigename (7.3 Regel 7).
      required: [displayName, isCurrentUser]
      properties:
        displayName:
          type: string
        isCurrentUser:
          type: boolean
    EntryStatus:
      type: string
      enum: [OPEN, CONFIRMED]
    FamilyEntry:
      type: object
      required: [id, workDate, durationMinutes, description, status, createdByDisplayName, canEdit, canDelete, version]
      properties:
        id:
          type: string
          format: uuid
        workDate:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '15:30'
        durationMinutes:
          type: integer
          format: int32
        description:
          type: string
        status:
          $ref: '#/components/schemas/EntryStatus'
        createdByDisplayName:
          type: string
        canEdit:
          type: boolean
          description: Offen, Schuljahr nicht abgeschlossen und das laufende (7.3 Regel 5, INV-14).
        canDelete:
          type: boolean
          description: Wie canEdit.
        version:
          type: integer
          format: int32
    EntryCreate:
      type: object
      required: [workDate, durationMinutes, description]
      properties:
        workDate:
          type: string
          format: date
          description: Nicht in der Zukunft, in einem offenen Schuljahr.
        startTime:
          type: string
          description: Nur im exakten Modus (D-09), 24-Stunden-Format.
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 720
          multipleOf: 15
          description: 15-Minuten-Raster, 15 bis 720 (D-09, OPEN-10).
        description:
          type: string
          minLength: 3
          maxLength: 500
          description: '"Was hast du gemacht?", 3 bis 500 Zeichen nach Trim. Bitte keine sensiblen Daten (DP-01).'
    EntryUpdate:
      type: object
      description: >-
        Merge Patch (8.1). Nur diese Felder sind änderbar, andere (z. B. status, familyId, createdBy) ergeben 400
        (AC-SEC-10).
      required: [version]
      properties:
        version:
          type: integer
          format: int32
          description: Optimistisches Locking (8.1).
        workDate:
          type: string
          format: date
        startTime:
          type: string
          description: Leerer Text entfernt die Uhrzeit.
          pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?$'
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 720
          multipleOf: 15
        description:
          type: string
          minLength: 3
          maxLength: 500
    AdminEntry:
      type: object
      required: [id, familyId, familyLabel, schoolYearId, schoolYearClosed, workDate, durationMinutes, description,
                 status, createdByDisplayName, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        familyLabel:
          type: string
        schoolYearId:
          type: string
          format: uuid
        schoolYearClosed:
          type: boolean
        workDate:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        durationMinutes:
          type: integer
          format: int32
        description:
          type: string
        status:
          $ref: '#/components/schemas/EntryStatus'
        createdByDisplayName:
          type: string
        createdAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
        confirmedByDisplayName:
          type: string
        version:
          type: integer
          format: int32
    EntryPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AdminEntry'
    EntryConfirmation:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
    ConfirmationResult:
      type: object
      required: [confirmed, skipped]
      properties:
        confirmed:
          type: integer
          format: int32
        skipped:
          type: integer
          format: int32
    OtherDeviceProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [maskedEmail]
          properties:
            maskedEmail:
              type: string
              example: m***@gmail.com
    Problem:
      type: object
      description: Fehlerformat nach RFC 9457 mit den Erweiterungen aus Lastenheft 8.1.
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          description: Immer `about:blank`, die Unterscheidung läuft über `code`.
          example: about:blank
        title:
          type: string
          description: HTTP-Statustext.
          example: Bad Request
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          example: 400
        detail:
          type: string
          description: Kurzer technischer Text ohne personenbezogene Daten.
        instance:
          type: string
          description: Pfad des Requests, auf den sich der Fehler bezieht.
          example: /api/v1/status
        code:
          type: string
          description: Stabiler, maschinenlesbarer Fehlercode. Die UI zeigt Texte anhand dieses Codes.
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: VALIDATION_FAILED
        traceId:
          type: string
          description: Korrelations-ID, identisch mit dem Header `X-Trace-Id`.
        errors:
          type: array
          description: Nur bei Validierungsfehlern. Enthält nie den abgelehnten Wert.
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: description
        code:
          type: string
          example: Size
        message:
          type: string
          example: size must be between 3 and 500
  parameters:
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntryStatusFilter:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/EntryStatus'
    FamilyFilter:
      name: familyId
      in: query
      schema:
        type: string
        format: uuid
    From:
      name: from
      in: query
      description: Frühestes Datum der Arbeit.
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      description: Spätestes Datum der Arbeit.
      schema:
        type: string
        format: date
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]{1,40}$'
    IdentityId:
      name: identityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SchoolYearId:
      name: schoolYearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FamilyId:
      name: familyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChildId:
      name: childId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Query:
      name: q
      in: query
      description: Suchtext, wirkt erst ab 2 Zeichen.
      schema:
        type: string
        maxLength: 100
    OverviewQuery:
      name: q
      in: query
      description: >-
        Suche in Familienbezeichnung, Kindernamen, Anzeigenamen und E-Mail-Adressen der Mitglieder; Groß- und
        Kleinschreibung und Diakritika egal (7.1.3). Mindestens 2 Zeichen (AC-OV-04).
      schema:
        type: string
        minLength: 2
        maxLength: 100
    OnlyMissing:
      name: onlyMissing
      in: query
      description: Nur Familien, denen noch bestätigte Minuten fehlen.
      schema:
        type: boolean
        default: false
    OverviewSort:
      name: sort
      in: query
      description: >-
        `feld,richtung`. Erlaubte Felder (Whitelist): familyLabel, children, memberCount, confirmedMinutes,
        openMinutes, missingMinutes. Danach immer familyLabel aufsteigend.
      schema:
        type: string
        pattern: '^(familyLabel|children|memberCount|confirmedMinutes|openMinutes|missingMinutes),(asc|desc)$'
        default: missingMinutes,desc
    Page:
      name: page
      in: query
      description: Seite, ab 0.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Einträge pro Seite, höchstens 200 (sonst 400 PAGE_SIZE_EXCEEDED).
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 50
    SchoolYearFilter:
      name: schoolYearId
      in: query
      schema:
        type: string
        format: uuid
    UserStatusFilter:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/UserStatus'
    UnassignedFilter:
      name: unassigned
      in: query
      schema:
        type: boolean
    DryRun:
      name: dryRun
      in: query
      description: Nur prüfen und zählen, nichts schreiben.
      schema:
        type: boolean
        default: false
  responses:
    BadRequest:
      description: Ungültige Anfrage oder Validierungsfehler.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Nicht angemeldet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Keine Berechtigung oder CSRF-Token fehlt.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Nicht gefunden (auch bei fremden IDs, kein Existenz-Orakel).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Konflikt mit dem aktuellen Zustand.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Anfrage zu groß.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate-Limit überschritten.
      headers:
        Retry-After:
          description: Sekunden bis zum nächsten erlaubten Versuch.
          schema:
            type: integer
            format: int32
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unerwarteter Fehler, ohne technische Details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
